<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best In The West Wireless | End of Year Sales Event</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      color: #f4f4f4;
      background: radial-gradient(900px 500px at 18% 8%, #350606, transparent 60%), #070707;
      font-family: Cairo, system-ui, Arial, sans-serif;
      line-height: 1.45;
    }

    .shell { width: min(100%, 860px); margin: 0 auto; padding: 16px; }

    .header {
      padding: 22px 12px;
      text-align: center;
      border: 1px solid #ffffff1a;
      border-radius: 18px;
      background: linear-gradient(180deg, #350909, #151010);
      box-shadow: 0 18px 50px #0007;
    }

    .headline { display: flex; align-items: center; justify-content: center; gap: 8px; }
    h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.6rem); line-height: 1.15; font-weight: 900; }
    .store { margin: 10px 0 0; font-size: 1rem; font-weight: 700; }
    .address { margin: 4px 0 0; color: #dedede; font-size: .9rem; }

    .popper {
      display: inline-block;
      font-size: clamp(1.1rem, 4vw, 1.8rem);
      animation: celebrate 750ms ease-in-out 3;
    }

    .popper:last-child { animation-delay: 120ms; }

    @keyframes celebrate {
      0%, 100% { transform: translateY(0) rotate(0); }
      45% { transform: translateY(-7px) rotate(-14deg) scale(1.18); }
      70% { transform: translateY(-2px) rotate(9deg); }
    }

    .deals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 340px));
      justify-content: center;
      align-items: start;
      gap: 12px;
      margin-top: 16px;
    }

    .card {
      padding: 8px;
      border: 1px solid #ffffff1a;
      border-radius: 16px;
      background: #ffffff08;
      box-shadow: 0 12px 30px #0005;
    }

    .card::before {
      content: "";
      display: block;
      height: 3px;
      margin-bottom: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f00, #f003);
    }

    .card img { display: block; width: 100%; height: auto; border-radius: 10px; }

    .cta {
      position: fixed;
      inset: auto 0 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: #080808ec;
      border-top: 1px solid #ffffff1a;
    }

    .cta a {
      width: min(100%, 828px);
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, #d90000, #b50000);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 900;
    }

    @media (max-width: 560px) {
      .deals { grid-template-columns: minmax(0, 340px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .popper { animation: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="headline">
        <span class="popper" aria-hidden="true">🎉</span>
        <h1>End of Year Sales Event</h1>
        <span class="popper" aria-hidden="true">🎉</span>
      </div>
      <p class="store">Best In The West Wireless Coupon</p>
      <p class="address">3010 W Third St, Dayton</p>
    </header>

    <section class="deals" aria-label="Sale offers">
      <div class="card">
        <a href="https://chilliswingsandrings.com/wp-content/uploads/2026/01/Copy-of-Best-Specials-Squares.png" aria-label="Open deal 1 at full size"><img src="https://chilliswingsandrings.com/wp-content/uploads/2026/01/Copy-of-Best-Specials-Squares.png" alt="Deal 1"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/h9fvTAY.png" aria-label="Open deal 2 at full size"><img src="https://i.imgur.com/h9fvTAY.png" alt="Deal 2"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/2JssdNV.png" aria-label="Open deal 3 at full size"><img src="https://i.imgur.com/2JssdNV.png" alt="Deal 3" loading="lazy"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/Wdsg1gv.png" aria-label="Open deal 4 at full size"><img src="https://i.imgur.com/Wdsg1gv.png" alt="Deal 4" loading="lazy"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/Q01Gg9T.png" aria-label="Open deal 5 at full size"><img src="https://i.imgur.com/Q01Gg9T.png" alt="Deal 5" loading="lazy"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/qVTJj08.png" aria-label="Open deal 6 at full size"><img src="https://i.imgur.com/qVTJj08.png" alt="Deal 6" loading="lazy"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/DqFkduv.png" aria-label="Open deal 7 at full size"><img src="https://i.imgur.com/DqFkduv.png" alt="Deal 7" loading="lazy"></a>
      </div>
      <div class="card">
        <a href="https://i.imgur.com/N4qdrgy.png" aria-label="Open deal 8 at full size"><img src="https://i.imgur.com/N4qdrgy.png" alt="Deal 8" loading="lazy"></a>
      </div>
    </section>
  </main>

  <div class="cta">
    <a href="tel:+19376401004">Call Now (937) 640-1004</a>
  </div>
</body>
</html>
